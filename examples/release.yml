# .github/workflows/release.yml in a project repository that publishes an
# image (here: the nomira frontend). Started by hand from the Actions tab.
name: release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [beta, final]
        default: beta
      dry-run:
        description: Only show version and changelog
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    uses: Nomira-OS/ci/.github/workflows/checks.yml@main

  release:
    needs: checks
    permissions:
      contents: write
    uses: Nomira-OS/ci/.github/workflows/release.yml@main
    with:
      channel: ${{ inputs.channel }}
      dry-run: ${{ inputs.dry-run }}

  image:
    needs: release
    if: ${{ !inputs.dry-run }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    uses: Nomira-OS/ci/.github/workflows/image.yml@main
    with:
      image: ghcr.io/nomira-os/nomira
      file: Dockerfile.frontend
      platforms: linux/amd64,linux/arm64
      tags: ${{ needs.release.outputs.version }}
